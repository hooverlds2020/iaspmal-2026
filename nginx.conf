server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- AJUSTE CLAVE: Permitir archivos de hasta 10MB ---
    client_max_body_size 10M;

    # Logs
    access_log /var/log/nginx/iaspmal_access.log;
    error_log /var/log/nginx/iaspmal_error.log;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agresivo para assets con hash
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Cache para otros assets
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # No cachear HTML
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Compresión optimizada
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml image/svg+xml;
    gzip_min_length 1000;

    # Headers de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
